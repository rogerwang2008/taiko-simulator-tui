[project]
name = "taiko-simulator-tui"
version = "0.1.0"
description = "Keyboard-split taiko drum simulator TUI with low-latency WASAPI audio"
readme = "README.md"
authors = [
    { name = "rogerwang2008", email = "rogerwang2008@163.com" }
]
requires-python = ">=3.14"
dependencies = [
    "miniaudio>=1.71",
    "numpy>=2.5.4",
    "platformdirs>=4.13.0",
    "sounddevice>=0.5.6",
    "soxr>=1.1.0",
    "textual>=8.2.8",
]

[project.scripts]
taiko-simulator-tui = "taiko_simulator_tui:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
